            <script> 

                    setupNavbarUi();


            const baseUrl="https://tarmeezacademy.com/api/v1";

                    for (const post of posts) {

                            const post_image=post.author.image;

                            const body=post.body

                            //for(const tag of tags){

                                `
                            //}
                          document.getElementById("posts").innerHTML+=`

                        <!--Post-->

                });

                function loginButtonClick(){
                    const username=document.getElementById("UsernameInput").value;
                    const password=document.getElementById("PasswordInput").value;
                    const params={
                        "username":username,
                        "password":password
                    }
                    const url=`${baseUrl}/login`;
                    axios.post(url,params).then(res=>{
                        console.log(res.data.token);
                        localStorage.setItem("token",res.data.token)
                        localStorage.setItem("currentUser",res.data.user)
                        const modal=document.getElementById("exampleModal");
                        const modalInstance=bootstrap.Modal.getInstance(modal);
                        modalInstance.hide();
                       // alert("user Loged in successfully")
                        showSuccessAlert("user Loged in successfully","success");
                        setupNavbarUi();
                    })
                    
                }
                function showSuccessAlert(message,type){
            const alertPlaceholder = document.getElementById('liveAlertPlaceholder')
                const appendAlert = (message, type) => {
                const wrapper = document.createElement('div')
                wrapper.innerHTML = [
                    `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                    `   <div>${message}</div>`,
                    '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                    '</div>'
                ].join('')

                alertPlaceholder.append(wrapper)
                }

              
                    appendAlert(message, type)
            /* todo:hide alert automaticly 
                setTimeout(()=>{
                     const alertToHide =bootstrap.Alert.getOrCreateInstance('#liveAlertPlaceholder')
                        alertToHide.dispose()
                     },3000)   */
                }
                function setupNavbarUi(){
                     const token=localStorage.getItem("token");//null
                     const loginDiv=document.getElementById("loginDiv");
                     const logoutDiv =document.getElementById("logoutDiv");
                     const RegisterBtn=document.getElementById("Register-btn");
                     const loginBtn=document.getElementById("login-btn");
                     if(token==null){//user is guest
                        loginBtn.style.display="inline-block"
                        RegisterBtn.style.display="inline-block";
                        //loginDiv.style.display="flex";
                        logoutDiv.style.display="none";
                        
                     }
                     else{
                        loginBtn.style.display="none"
                        RegisterBtn.style.display="none";
                        //loginDiv.style.display="flex";
                        logoutDiv.style.display="block";
                     }

                }
                function logout(){
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    //alert("logout SuccesFully");
                    showSuccessAlert("logout SuccesFully","danger");
                    setupNavbarUi()
                }
            </script>
